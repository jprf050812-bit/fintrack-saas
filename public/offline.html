<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>FinTrack - Sem conexão</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;padding:24px;text-align:center}
  .box{max-width:340px}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 8px}
  p{font-size:14px;color:#475569;line-height:1.5;margin:0 0 20px}
  button{min-height:44px;padding:0 20px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:500}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="FinTrack">
  <h1>Você está sem conexão</h1>
  <p>Seus dados financeiros só são exibidos com internet, para ficarem seguros e atualizados. Nenhuma operação foi registrada.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</div>
</body>
</html>
